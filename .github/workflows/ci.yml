name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Test .NET API
        run: dotnet test --configuration Release

      - name: Test Go worker
        working-directory: worker
        run: go test ./...

      - name: Build Go worker
        working-directory: worker
        run: go build ./cmd/ledger-worker
